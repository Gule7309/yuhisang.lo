<text x="530" y="206" class="chip">Option C</text>
<path class="line" d="M647 202 H761" marker-end="url(#arrow)"/>
<rect x="787" y="176" width="259" height="53" rx="9" fill="#f5f8fa" stroke="#e1e9f0"/>
<text x="809" y="199" class="lab">Clarification vs. execution</text>
<text x="809" y="216" class="meta">Trace decision &amp; uncertainty</text>

<rect class="a" x="40" y="276" width="1040" height="107" rx="12"/>
<rect x="40" y="276" width="7" height="107" rx="3.5" fill="#4d9b84"/>
<text x="70" y="312" class="lab">2  Oracle-complete</text>
<text x="70" y="335" class="small">Compatible option inserted</text>
<text x="70" y="354" class="meta">Diagnostic condition</text>
<rect x="246" y="302" width="116" height="43" rx="8" fill="#eef4f9" stroke="#d8e4ef"/>
<text x="271" y="328" class="chip">Option A</text>
<rect x="374" y="302" width="116" height="43" rx="8" fill="#eef4f9" stroke="#d8e4ef"/>
