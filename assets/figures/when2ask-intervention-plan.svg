<rect x="502" y="424" width="136" height="43" rx="8" fill="#fff5e5" stroke="#ebd3a6" stroke-dasharray="4 3"/>
<text x="533" y="450" class="warning">Decoy</text>
<path class="line" d="M647 446 H761" marker-end="url(#arrow)"/>
<rect x="787" y="420" width="259" height="53" rx="9" fill="#f5f8fa" stroke="#e1e9f0"/>
<text x="809" y="443" class="lab">Same downstream logic</text>
<text x="809" y="460" class="meta">Assess high-confidence errors</text>
<line x1="40" y1="526" x2="1080" y2="526" stroke="#e3eaf0"/>
<text x="40" y="549" class="meta">CONCEPTUAL EXPERIMENT DESIGN  ·  Not benchmark results or a reproduced figure from the original paper</text>
