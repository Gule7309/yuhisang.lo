<rect x="502" y="302" width="136" height="43" rx="8" fill="#e8f7f0" stroke="#b9dec9"/>
<text x="521" y="328" class="match">Compatible</text>
<path class="line" d="M647 324 H761" marker-end="url(#arrow)"/>
<rect x="787" y="298" width="259" height="53" rx="9" fill="#f5f8fa" stroke="#e1e9f0"/>
<text x="809" y="321" class="lab">Same downstream logic</text>
<text x="809" y="338" class="meta">Compare planned metrics</text>

<rect class="a" x="40" y="398" width="1040" height="107" rx="12"/>
<rect x="40" y="398" width="7" height="107" rx="3.5" fill="#c49a4b"/>
