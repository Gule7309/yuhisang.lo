name: Audit main release governance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only governance report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit_release_governance.cjs
