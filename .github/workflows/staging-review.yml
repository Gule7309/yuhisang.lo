name: CMS staging publication gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cms-content-only:
    if: github.event.pull_request.head.ref == 'cms-staging' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging branch incorporates current main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || {
            echo "::error::cms-staging is behind main. Incorporate latest main without discarding pending drafts before publishing.";
            exit 1;
          }
      - name: Reject non-CMS files in staging publication
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c core.quotepath=false diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/cms-changed-files.txt
          node scripts/validate_staging_changes.cjs /tmp/cms-changed-files.txt
      - name: Validate changed published Research and Projects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- content/works.json; then
            echo "Research / Projects content unchanged; no record-level validation needed." >> "$GITHUB_STEP_SUMMARY"
          else
            git show "$BASE_SHA:content/works.json" > /tmp/cms-base-works.json
            git show "$HEAD_SHA:content/works.json" > /tmp/cms-staged-works.json
            node scripts/validate_content_release.cjs /tmp/cms-base-works.json /tmp/cms-staged-works.json | tee /tmp/cms-release-summary.txt
            {
              echo '### CMS content release review'
              echo '```'
              cat /tmp/cms-release-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
