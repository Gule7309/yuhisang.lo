name: Capture authentic Trading Radar UI (review-only)
on:
  push:
    branches: [feature/authentic-portfolio-media-20261102]
    paths:
      - .github/workflows/capture-real-ui.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public Trading Radar frontend
        uses: actions/checkout@v4
        with:
          repository: Gule7309/trading_radar
          ref: main
          path: trading-radar
          persist-credentials: false
      - name: Checkout public Trading Radar mock API branch
        uses: actions/checkout@v4
        with:
          repository: Gule7309/trading_radar
          ref: feat/b-agent-mvp
          path: trading-radar-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese fonts and frontend/backend dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm ci --prefix trading-radar/apps/web --no-audit --no-fund
          npm install --prefix trading-radar-backend --no-audit --no-fund
      - name: Start public development mock backend (no live credentials)
        run: |
          cd trading-radar-backend
          npm run api:mock > /tmp/trading-radar-mock.log 2>&1 &
          echo $! > /tmp/trading-radar-mock.pid
          for i in $(seq 1 50); do
            if curl -f -s http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 2
          done
          curl -f http://127.0.0.1:8787/health
      - name: Start actual app in development fixture mode
        run: |
          cd trading-radar/apps/web
          npm run dev -- --host 127.0.0.1 > /tmp/trading-radar-vite.log 2>&1 &
          echo $! > /tmp/trading-radar-vite.pid
          for i in $(seq 1 60); do
            if curl -f -s http://localhost:5173/design-qa?data=demo > /dev/null; then break; fi
            sleep 2
          done
          curl -f -I http://localhost:5173/design-qa?data=demo
      - name: Capture real application UI (test fixtures clearly labeled)
        run: |
          mkdir -p screenshots
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          timeout 70 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,960 --screenshot="$GITHUB_WORKSPACE/screenshots/trading-radar-desktop-demo.png" 'http://localhost:5173/design-qa?data=demo'
          timeout 70 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3500 --window-size=430,920 --screenshot="$GITHUB_WORKSPACE/screenshots/trading-radar-mobile-demo.png" 'http://localhost:5173/design-qa?data=demo'
          timeout 70 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,960 --screenshot="$GITHUB_WORKSPACE/screenshots/trading-radar-dashboard-demo.png" 'http://localhost:5173/'
          timeout 70 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3500 --window-size=430,920 --screenshot="$GITHUB_WORKSPACE/screenshots/trading-radar-dashboard-mobile-demo.png" 'http://localhost:5173/'
          file screenshots/*.png
          test $(stat -c %s screenshots/trading-radar-desktop-demo.png) -gt 18000
          test $(stat -c %s screenshots/trading-radar-mobile-demo.png) -gt 10000
      - name: Upload screenshot for manual verification (not published yet)
        uses: actions/upload-artifact@v4
        with:
          name: real-trading-radar-ui-capture
          path: screenshots/*.png
          retention-days: 7
