backend:
  name: github
  repo: Gule7309/yuhisang.lo
  branch: main
  auth_methods: [token]
app_title: Gule Luo Portfolio CMS
site_url: https://gule7309.github.io/yuhisang.lo/
display_url: https://gule7309.github.io/yuhisang.lo/
media_folder: /assets/uploads
public_folder: /yuhisang.lo/assets/uploads
media_libraries:
  default:
    config:
      slugify_filename: true
collections:
  - name: profile
    label: Profile, Education and Experience
    files:
      - name: profile
        label: Profile and Links
        file: content/profile.json
        format: json
        fields:
          - {name: name_en, label: Name English, widget: string}
          - {name: name_zh, label: Name Chinese, widget: string}
          - {name: short_name, label: Short Name, widget: string}
          - {name: role_en, label: Role English, widget: string}
          - {name: role_zh, label: Role Chinese, widget: string}
          - {name: affiliation_en, label: Affiliation English, widget: string}
          - {name: affiliation_zh, label: Affiliation Chinese, widget: string}
          - {name: headline_en, label: Headline English, widget: string}
          - {name: headline_zh, label: Headline Chinese, widget: string}
          - {name: about_en, label: About English, widget: text}
          - {name: about_zh, label: About Chinese, widget: text}
          - {name: avatar, label: Profile photo, widget: image, required: false}
          - {name: email, label: Public email, widget: string, required: false}
          - name: cv_url
            label: Public CV PDF (upload or URL)
            widget: file
            accept: application/pdf,.pdf
            required: false
            media_folder: /assets/cv
            public_folder: /yuhisang.lo/assets/cv
          - {name: interests, label: Research interests, widget: list, required: false}
          - name: socials
            label: Social and professional links
            hint: Prefer GitHub, LinkedIn, Email, CV; add X or Instagram only if intended for public visitors.
            widget: list
            required: false
            fields:
              - {name: label, label: Name, widget: string}
              - {name: url, label: URL, widget: string}
              - name: icon
                label: Icon (optional / 可留空自動偵測)
                hint: New links automatically get a matching icon from their platform URL or label. Other sites get a generic link icon.
                widget: select
                required: false
                options: [auto, github, gitlab, linkedin, instagram, x, threads, youtube, scholar, orcid, email, cv, blog, substack, notion, website, facebook, medium, discord, telegram, tiktok, reddit, twitch, behance, dribbble, stackoverflow, researchgate, link]
          - name: education
            label: Education
            widget: list
            fields:
              - {name: institution_en, label: School English, widget: string}
              - {name: institution_zh, label: School Chinese, widget: string}
              - {name: degree_en, label: Degree English, widget: string}
              - {name: degree_zh, label: Degree Chinese, widget: string}
              - {name: period, label: Years, widget: string}
              - {name: details_en, label: Details English, widget: text, required: false}
              - {name: details_zh, label: Details Chinese, widget: text, required: false}
          - name: experience
            label: Experience
            widget: list
            required: false
            fields:
              - {name: organization_en, label: Organization English, widget: string}
              - {name: organization_zh, label: Organization Chinese, widget: string}
              - {name: role_en, label: Role English, widget: string}
              - {name: role_zh, label: Role Chinese, widget: string}
              - {name: period, label: Years, widget: string}
              - {name: details_en, label: Details English, widget: text, required: false}
              - {name: details_zh, label: Details Chinese, widget: text, required: false}
              - {name: published, label: Show, widget: boolean, default: false}
  - name: works
    label: Research and Projects
    file: content/works.json
    identifier_field: slug
    summary: '{{title_en}}'
    fields:
      - {name: slug, label: ID, widget: string}
      - {name: category, label: Section, widget: select, options: [research, project]}
      - {name: title_en, label: Title English, widget: string}
      - {name: title_zh, label: Title Chinese, widget: string}
      - {name: subtitle_en, label: Subtitle English, widget: string}
      - {name: subtitle_zh, label: Subtitle Chinese, widget: string}
      - {name: summary_en, label: Summary English, widget: text}
      - {name: summary_zh, label: Summary Chinese, widget: text}
      - name: role_en
        label: Case Study — My Role (English)
        widget: text
        required: false
        hint: Product/engineering case study only; research uses the dedicated Research Note fields below.
      - {name: role_zh, label: Case Study — 我的角色 (中文), widget: text, required: false}
      - {name: challenge_en, label: Case Study — Problem (English), widget: text, required: false}
      - {name: challenge_zh, label: Case Study — 問題與動機 (中文), widget: text, required: false}
      - {name: approach_en, label: Case Study — Approach (English), widget: text, required: false}
      - {name: approach_zh, label: Case Study — 設計解法 (中文), widget: text, required: false}
      - {name: outcome_en, label: Case Study — Progress and evidence (English), widget: text, required: false}
      - {name: outcome_zh, label: Case Study — 進度與成果 (中文), widget: text, required: false}
      - {name: next_steps_en, label: Case Study — Next steps (English), widget: text, required: false}
      - {name: next_steps_zh, label: Case Study — 下一步 (中文), widget: text, required: false}
      - {name: architecture_note_en, label: Architecture context (English; describe conceptual limits), widget: text, required: false}
      - {name: architecture_note_zh, label: 架構說明 (中文；註明系統與驗證界線), widget: text, required: false}
      - name: architecture_layers
        label: Case Study — System layers / 系統分層
        widget: list
        required: false
        hint: Show 2–5 verified high-level components. Do not claim a conceptual diagram is a measured production topology. Project category only.
        fields:
          - {name: title_en, label: Layer title English, widget: string}
          - {name: title_zh, label: 分層名稱中文, widget: string}
          - {name: description_en, label: Short explanation English, widget: text}
          - {name: description_zh, label: 簡短說明中文, widget: text}
          - name: stage
            label: Verified scope / 已核實階段
            widget: select
            default: prototype
            options:
              - {label: Implemented / 已實作, value: implemented}
              - {label: Prototype / 原型, value: prototype}
              - {label: Planned / 規劃中, value: planned}
      - name: engineering_decisions
        label: Case Study — Engineering decisions / 工程取捨
        widget: list
        required: false
        hint: Explain the real constraint and design choice without unsupported speed or business claims.
        fields:
          - {name: title_en, label: Decision English, widget: string}
          - {name: title_zh, label: 決策中文, widget: string}
          - {name: rationale_en, label: Engineering rationale English, widget: text}
          - {name: rationale_zh, label: 工程原因中文, widget: text}
      - name: verification_evidence
        label: Case Study — Tests and limitations / 驗證與限制
        widget: list
        required: false
        hint: State actual checked scope. Use public evidence links only; never paste private accounts, keys or unpublished claims.
        fields:
          - {name: title_en, label: Test/limitation English, widget: string}
          - {name: title_zh, label: 測試或限制中文, widget: string}
          - {name: detail_en, label: Details English, widget: text}
          - {name: detail_zh, label: 詳細說明中文, widget: text}
          - name: status
            label: Evidence status / 證據狀態
            widget: select
            default: pending
            options:
              - {label: Tested (specific scope) / 已完成特定測試, value: verified}
              - {label: Limited evidence / 證據有限, value: limited}
              - {label: Not yet validated / 尚未驗證, value: pending}
          - {name: source_url, label: Public source URL (HTTPS only; optional), widget: string, required: false}

      - name: publication_status
        label: Research publication status / 研究發表狀態
        widget: select
        required: false
        default: work_in_progress
        hint: A research page is NOT an accepted paper. Select Preprint or Peer reviewed only for your own real paper and provide the paper link; Peer reviewed also requires a verified venue.
        options:
          - {label: Work in progress / 尚未發表, value: work_in_progress}
          - {label: Preprint (paper URL required) / 預印本, value: preprint}
          - {label: Peer-reviewed publication (venue and paper URL required) / 已發表, value: peer_reviewed}
      - {name: publication_venue, label: Verified venue for own paper (if peer reviewed), widget: string, required: false}
      - {name: research_question_en, label: Research — Question English, widget: text, required: false}
      - {name: research_question_zh, label: Research — 問題中文, widget: text, required: false}
      - {name: research_background_en, label: Research — Background English, widget: text, required: false}
      - {name: research_background_zh, label: Research — 背景中文, widget: text, required: false}
      - {name: research_approach_en, label: Research — Approach English, widget: text, required: false}
      - {name: research_approach_zh, label: Research — 方法中文, widget: text, required: false}
      - {name: research_evaluation_en, label: Research — Evaluation Plan English, widget: text, required: false}
      - {name: research_evaluation_zh, label: Research — 評估規劃中文, widget: text, required: false}
      - {name: research_progress_en, label: Research — Current Progress English, widget: text, required: false}
      - {name: research_progress_zh, label: Research — 目前進度中文, widget: text, required: false}
      - {name: research_limitations_en, label: Research — Limitations English, widget: text, required: false}
      - {name: research_limitations_zh, label: Research — 研究限制中文, widget: text, required: false}
      - {name: research_next_steps_en, label: Research — Next Steps English, widget: text, required: false}
      - {name: research_next_steps_zh, label: Research — 下一步中文, widget: text, required: false}
      - name: research_figures
        label: Research — Verified Figures / 研究圖表
        widget: list
        required: false
        hint: Upload only authentic diagrams or figures you own or are licensed to use. Captions must attribute external sources.
        fields:
          - {name: image, label: Figure image, widget: image}
          - {name: alt_en, label: Alternative description English, widget: string, required: false}
          - {name: alt_zh, label: 圖片描述中文, widget: string, required: false}
          - {name: caption_en, label: Caption English, widget: text, required: false}
          - {name: caption_zh, label: 圖說中文, widget: text, required: false}
          - {name: source_url, label: Original figure source URL, widget: string, required: false}
      - name: research_references
        label: Research — References & Prior Work / 參考文獻
        widget: list
        required: false
        fields:
          - {name: title_en, label: Citation English, widget: string}
          - {name: title_zh, label: 文獻名稱中文, widget: string, required: false}
          - {name: url, label: Verified source URL, widget: string}
          - {name: note_en, label: Note English, widget: text, required: false}
          - {name: note_zh, label: 備註中文, widget: text, required: false}
      - name: source_traces
        label: Implementation proof / 程式碼實作證據（Research & Projects）
        widget: list
        required: false
        hint: Public GitHub code only. Use an immutable 40-character commit SHA and exact #Lx-Ly anchor; paste matching 1–14 source lines. Never paste private PixelFit code, secrets, research results or third-party code without proper attribution.
        fields:
          - {name: title_en, label: What this code demonstrates (English), widget: string}
          - {name: title_zh, label: 此程式碼展示什麼（中文）, widget: string}
          - {name: explanation_en, label: Explanation and evidence limits English, widget: text}
          - {name: explanation_zh, label: 技術解釋與驗證界線中文, widget: text}
          - {name: code, label: Exact source code excerpt (1–14 lines), widget: text}
          - name: language
            label: Code language
            widget: select
            default: text
            options:
              - {label: Python, value: python}
              - {label: TypeScript, value: typescript}
              - {label: JavaScript, value: javascript}
              - {label: Plain text, value: text}
          - name: source_url
            label: "Pinned public GitHub source URL (commit SHA and #Lx-Ly)"
            widget: string
      - {name: status_en, label: Status English, widget: string}
      - {name: status_zh, label: Status Chinese, widget: string}
      - name: status_type
        label: Status color / 狀態顏色
        hint: Choose the project stage for a consistent badge; Auto recognizes common English and Chinese labels.
        widget: select
        required: false
        default: auto
        options:
          - {label: Auto (from status text), value: auto}
          - {label: Exploration / 探索（暖黃色）, value: exploration}
          - {label: Active development / 持續開發（青綠色）, value: active}
          - {label: Testing / 測試（紫色）, value: testing}
          - {label: Prototype / 原型（藍色）, value: prototype}
          - {label: Research in progress / 研究中（藍色）, value: research}
          - {label: Proposal / 提案（淡紫色）, value: proposal}
          - {label: Released / 已上線（綠色）, value: released}
          - {label: Paused / 暫停（灰色）, value: paused}
          - {label: Other / 其他（中性）, value: default}
      - {name: year, label: Year, widget: string}
      - {name: tags, label: Tags, widget: list, required: false}
      - name: media_layout
        label: Cover display / 封面版型
        widget: select
        default: default
        required: false
        hint: Choose Phone screenshots only for verified portrait UI captures in the gallery. Keeps existing layout for all other projects and research.
        options:
          - {label: Standard image / 標準圖片, value: default}
          - {label: Phone screenshots / 手機介面截圖, value: phone}
      - {name: image, label: Cover image (authentic screenshots or original diagrams only), widget: image, required: false}
      - {name: image_alt_en, label: Cover alt text English, widget: string, required: false}
      - {name: image_alt_zh, label: 封面圖替代文字 (中文), widget: string, required: false}
      - {name: image_caption_en, label: Cover image context / source (English), widget: text, required: false}
      - {name: image_caption_zh, label: 封面圖片的來源與使用情境 (中文), widget: text, required: false}
      - {name: media_label_en, label: Cover label English (e.g. Real UI · mock data), widget: string, required: false}
      - {name: media_label_zh, label: 封面短標籤 (例如：真實介面／Mock 資料), widget: string, required: false}
      - name: gallery
        label: Real screenshots (optional; never simulated as real data)
        widget: list
        required: false
        fields:
          - {name: image, label: Screenshot, widget: image}
          - {name: caption_en, label: Caption English, widget: string, required: false}
          - {name: caption_zh, label: Caption Chinese, widget: string, required: false}
      - {name: github, label: GitHub URL, widget: string, required: false}
      - {name: demo, label: Demo URL, widget: string, required: false}
      - {name: video_link, label: Public demo video URL, widget: string, required: false}
      - {name: paper, label: Paper URL, widget: string, required: false}
      - name: featured
        label: Featured on homepage
        widget: boolean
        default: false
        hint: Featured projects appear on the homepage; all other published projects remain in the project archive. Research entries can be listed independently.
      - name: published
        label: Public on website / 網站顯示
        hint: Website visibility ONLY. This public GitHub repository still exposes saved draft JSON. It is NOT academic publication status.
        widget: boolean
        default: false
      - {name: order, label: Order, widget: number, value_type: int, default: 50}
  - name: news
    label: News
    file: content/news.json
    identifier_field: date
    summary: '{{date}} {{title_en}}'
    fields:
      - {name: date, label: Date YYYY-MM, widget: string}
      - {name: title_en, label: English, widget: text}
      - {name: title_zh, label: Chinese, widget: text}
      - {name: published, label: Public, widget: boolean, default: true}
  - name: writing
    label: Writing & Research Notes
    label_singular: Note
    file: content/writing.json
    identifier_field: slug
    summary: '{{title_en}}'
    fields:
      - {name: slug, label: Unique ID, widget: string}
      - {name: date, label: Date (YYYY-MM), widget: string}
      - {name: type, label: Type, widget: select, options: [Research Note, Technical Article, Reflection]}
      - {name: title_en, label: Title English, widget: string}
      - {name: title_zh, label: Title Chinese, widget: string}
      - {name: summary_en, label: Summary English, widget: text}
      - {name: summary_zh, label: Summary Chinese, widget: text}
      - {name: body_en, label: Note English, widget: text}
      - {name: body_zh, label: Note Chinese, widget: text}
      - {name: related_url, label: Related resource URL, widget: string, required: false}
      - {name: published, label: Public, widget: boolean, default: false}
      - {name: order, label: Display Order, widget: number, value_type: int, default: 50}
  - name: achievements
    label: Awards & Credentials
    label_singular: Achievement
    file: content/achievements.json
    identifier_field: slug
    summary: '{{title_en}}'
    fields:
      - {name: slug, label: Unique ID, widget: string}
      - {name: type, label: Type, widget: select, options: [award, certification, achievement]}
      - {name: title_en, label: Title English, widget: string}
      - {name: title_zh, label: Title Chinese, widget: string}
      - {name: year, label: Year, widget: string}
      - {name: issuer, label: Issuer, widget: string, required: false}
      - {name: details_en, label: Details English, widget: text, required: false}
      - {name: details_zh, label: Details Chinese, widget: text, required: false}
      - {name: evidence_url, label: Public evidence URL, widget: string, required: false}
      - {name: published, label: Public, widget: boolean, default: false}
      - {name: order, label: Display Order, widget: number, value_type: int, default: 50}
  - name: personal
    label: Beyond Research & Photography
    files:
      - name: personal
        label: Personal Introduction & Photo Gallery
        file: content/personal.json
        format: json
        fields:
          - {name: published, label: Show personal section, widget: boolean, default: true}
          - {name: title_en, label: Section title English, widget: string}
          - {name: title_zh, label: Section title Chinese, widget: string}
          - {name: about_en, label: Personal introduction English, widget: text}
          - {name: about_zh, label: Personal introduction Chinese, widget: text}
          - name: photos
            label: Photography gallery
            widget: list
            required: false
            fields:
              - {name: image, label: Photo, widget: image}
              - {name: caption_en, label: Caption English, widget: string, required: false}
              - {name: caption_zh, label: Caption Chinese, widget: string, required: false}
